name: One-time scanner freshness hardening

on:
  push:
    paths:
      - '.github/workflows/harden-freshness.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scanner freshness guards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scanner-v3.html')
          s = p.read_text()
          replacements = [
            ("const BUILD='2026-08-14.4';", "const BUILD='2026-08-14.5';"),
            ("if(type==='SPLIT'&&(!t||Math.abs(now-t)<=2*864e5))return{type,message:a.message||a.header||'Recent split'}}return null}", "if(type==='SPLIT'&&(!t||Math.abs(now-t)<=2*864e5))return{type,message:a.message||a.header||'Recent split'};if(type==='TICKER_CHANGE'&&(!t||Math.abs(now-t)<=14*864e5))return{type,message:a.message||a.header||'Recent ticker change'}}return null}"),
            ("hardExcluded=actionRisk?.type==='DELISTING'", "hardExcluded=['DELISTING','TICKER_CHANGE'].includes(actionRisk?.type)"),
            ("rows=rows.map(x=>scoreDiscovery(x,state.prev.get(x.symbol))).map(x=>({...x,stage:stageFromDiscovery(x)}));", "rows=rows.map(x=>scoreDiscovery(x,state.prev.get(x.symbol))).filter(x=>x.ageSec<=(x.session==='REGULAR'?300:900)).map(x=>({...x,stage:stageFromDiscovery(x)}));"),
            ("stale spread rejection, recent split penalty, delisting exclusion", "stale spread rejection, hard quote freshness, recent split penalty, delisting/ticker-change exclusion"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected source pattern not found: {old[:90]}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit hardened scanner
        run: |
          git config user.name "scanner-build-bot"
          git config user.email "scanner-build-bot@users.noreply.github.com"
          git add scanner-v3.html
          git commit -m "Hard exclude stale quotes and recent ticker changes"
          git push
