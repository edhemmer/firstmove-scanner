<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FirstMove Scanner</title>
<meta name="description" content="Early momentum market monitor"/>
<style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e6edf3;background:#070b11}*{box-sizing:border-box}body{margin:0;background:#070b11;color:#e6edf3}.wrap{max-width:1500px;margin:auto;padding:20px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 0 18px;border-bottom:1px solid #1f2937}.brand h1{font-size:21px;margin:0}.muted{color:#8b98a8;font-size:13px}.pill,.btn{border:1px solid #2a3544;background:#0e1621;color:#e6edf3;border-radius:8px;padding:9px 12px}.btn{cursor:pointer}.btn.primary{background:#17d7cf;color:#021314;border-color:#17d7cf;font-weight:700}.toolbar,.card{background:#0c131d;border:1px solid #202b38;border-radius:12px}.toolbar{padding:14px;margin:16px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:#9ca9b8}input,select{background:#0a1018;border:1px solid #283445;color:#e6edf3;border-radius:7px;padding:9px}.status{display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#788493}.dot.live{background:#2ee59d}.dot.err{background:#ff6b6b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.radar{padding:14px;margin:16px 0}.radar-card{padding:12px;border:1px solid #263242;border-radius:10px;background:#0a1119}.radar-card h3{margin:0 0 5px}.score{font-size:25px;font-weight:800}.stage{display:inline-block;padding:4px 7px;border-radius:6px;border:1px solid #334155;font-size:11px}.stage.EARLY,.stage.BUILDING{border-color:#1f9d75}.stage.EXTENDED{border-color:#c58b2a}.stage.WEAKENING{border-color:#bd4b4b}.table{overflow:auto;margin:16px 0}.table table{width:100%;border-collapse:collapse;min-width:1050px}.table th,.table td{padding:11px 10px;border-bottom:1px solid #1d2733;text-align:right;font-size:12px}.table th:first-child,.table td:first-child,.table th:nth-child(2),.table td:nth-child(2),.table th:last-child,.table td:last-child{text-align:left}.good{color:#40e39d}.bad{color:#ff7b7b}.warn{color:#f5bd56}.section-title{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}.card{padding:14px}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(520px,92vw);background:#0b121b;border-left:1px solid #263140;padding:20px;z-index:10;overflow:auto;box-shadow:-20px 0 60px #0008}.drawer h2{margin-top:0}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.error{color:#ff8b8b;font-size:12px;white-space:pre-wrap}.small{font-size:11px;color:#8b98a8}.log{margin-top:16px}.banner{padding:14px;border:1px solid #624c18;background:#1b180c;border-radius:10px;color:#f4d375;margin-top:16px}.reason{max-width:320px;text-align:left!important;color:#a8b4c4}.pin{cursor:pointer;color:#8ea1b5}.pin.on{color:#f5bd56}@media(max-width:700px){.wrap{padding:12px}.top{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch}.field{min-width:45%}}</style>
</head>
<body>
<div id="app"></div>
<script>const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={key:localStorage.getItem('fm_key')||'',symbols:JSON.parse(localStorage.getItem('fm_symbols')||'["AAPL","NVDA","TSLA","AMD","PLTR"]'),pinned:new Set(JSON.parse(localStorage.getItem('fm_pinned')||'[]')),trades:{},socket:null,status:'idle',errors:[],lastMsg:null,logs:JSON.parse(localStorage.getItem('fm_logs')||'[]')};
function save(){localStorage.setItem('fm_symbols',JSON.stringify(state.symbols));localStorage.setItem('fm_pinned',JSON.stringify([...state.pinned]));localStorage.setItem('fm_logs',JSON.stringify(state.logs));}
function pct(a,b){return b?((a/b)-1)*100:0} function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function atOrBefore(arr,ms){for(let i=arr.length-1;i>=0;i--)if(arr[i].t<=ms)return arr[i].p;return arr[0]?.p}
function metrics(sym){const a=state.trades[sym]||[]; if(!a.length)return null; const now=Date.now(), last=a[a.length-1], p=last.p; const p1=atOrBefore(a,now-60000),p3=atOrBefore(a,now-180000),p5=atOrBefore(a,now-300000),p6=atOrBefore(a,now-360000); const r1=pct(p,p1),r3=pct(p,p3),r5=pct(p,p5),prev3=pct(p3,p6); const cur=a.filter(x=>x.t>now-60000), prev=a.filter(x=>x.t<=now-60000&&x.t>now-120000); const cv=cur.reduce((s,x)=>s+x.v,0),pv=prev.reduce((s,x)=>s+x.v,0),cN=cur.length,pN=prev.length; const volAccel=pv?cv/pv:cv?2:0,tradeAccel=pN?cN/pN:cN?2:0; const dv=a.filter(x=>x.t>now-300000).reduce((s,x)=>s+x.p*x.v,0); const accel=r3-prev3; const recent=a.filter(x=>x.t>now-900000); const hi=Math.max(...recent.map(x=>x.p)), nearHi=hi?p/hi:0; const pricePts=clamp((Math.max(0,r1)*5+Math.max(0,accel)*5),0,30); const flowPts=clamp((Math.max(0,volAccel-1)*9+Math.max(0,tradeAccel-1)*6),0,25); const liquidityPts=clamp(Math.log10(Math.max(1,dv))*2.2,0,15); const extensionPts=15-clamp(Math.abs(r5)*1.6,0,15); const hiPts=clamp((nearHi-.94)*125,0,10); const qualityPts=Date.now()-last.t<10000?5:Date.now()-last.t<60000?3:1; const score=Math.round(clamp(pricePts+flowPts+liquidityPts+extensionPts+hiPts+qualityPts,0,100)); let stage='WATCH'; if(r5>8||r3>5)stage='EXTENDED'; else if(accel<-.35&&r1<0)stage='WEAKENING'; else if(score>=78&&r1>0&&volAccel>1.25)stage='BUILDING'; else if(score>=62&&r1>0&&accel>0)stage='EARLY'; const why=[]; if(accel>.2)why.push(`price acceleration +${accel.toFixed(2)}%`); if(volAccel>1.2)why.push(`volume ${volAccel.toFixed(1)}x prior min`); if(tradeAccel>1.2)why.push(`trade pace ${tradeAccel.toFixed(1)}x`); if(nearHi>.985)why.push('near 15m high'); if(!why.length)why.push('insufficient acceleration'); return {sym,p,r1,r3,r5,volAccel,tradeAccel,dv,accel,score,stage,last:last.t,why:why.join(' • ')}}
function maybeLog(m){if(!m||m.score<70||!['EARLY','BUILDING'].includes(m.stage))return; const today=new Date().toISOString().slice(0,10), id=`${today}:${m.sym}`; if(!state.logs.find(x=>x.id===id))state.logs.unshift({id,sym:m.sym,time:Date.now(),price:m.p,score:m.score,stage:m.stage,mfe:0,mae:0}); save()}
function updateLogs(m){if(!m)return; for(const l of state.logs.filter(x=>x.sym===m.sym)){const move=pct(m.p,l.price);l.mfe=Math.max(l.mfe,move);l.mae=Math.min(l.mae,move)}save()}
function addTrade(tr){if(!tr?.s||!Number.isFinite(tr.p)||!Number.isFinite(tr.t))return; const a=state.trades[tr.s]||(state.trades[tr.s]=[]); a.push({p:+tr.p,t:+tr.t,v:+tr.v||0}); const cutoff=Date.now()-20*60*1000; while(a.length&&a[0].t<cutoff)a.shift(); const m=metrics(tr.s); maybeLog(m);updateLogs(m)}
function connect(){if(state.socket)try{state.socket.close()}catch{}; if(!state.key){state.status='idle';render();return} state.status='connecting';render(); const ws=new WebSocket(`wss://ws.finnhub.io?token=${encodeURIComponent(state.key)}`);state.socket=ws;ws.onopen=()=>{state.status='live';state.errors=[];state.symbols.slice(0,50).forEach(symbol=>ws.send(JSON.stringify({type:'subscribe',symbol})));render()};ws.onmessage=e=>{state.lastMsg=Date.now();try{const m=JSON.parse(e.data); if(m.type==='trade')m.data.forEach(addTrade); else if(m.type==='error')state.errors.unshift(m.msg||e.data)}catch(err){state.errors.unshift(String(err))}render()};ws.onerror=()=>{state.status='error';state.errors.unshift('WebSocket error. Check API key/network.');render()};ws.onclose=()=>{if(state.status!=='idle')state.status='closed';render()}}
function addSymbol(sym){sym=(sym||'').trim().toUpperCase();if(!sym||state.symbols.includes(sym)||state.symbols.length>=50)return;state.symbols.push(sym);save();if(state.socket?.readyState===1)state.socket.send(JSON.stringify({type:'subscribe',symbol:sym}));render()}
function removeSymbol(sym){state.symbols=state.symbols.filter(x=>x!==sym);state.pinned.delete(sym);save();if(state.socket?.readyState===1)state.socket.send(JSON.stringify({type:'unsubscribe',symbol:sym}));delete state.trades[sym];render()}
function cls(x){return x>0?'good':x<0?'bad':''}function fmtPct(x){return `<span class="${cls(x)}">${x>=0?'+':''}${x.toFixed(2)}%</span>`}function fmtMoney(x){return x>=1e6?'$'+(x/1e6).toFixed(1)+'M':x>=1e3?'$'+(x/1e3).toFixed(0)+'K':'$'+x.toFixed(0)}
function render(){const rows=state.symbols.map(metrics).filter(Boolean).sort((a,b)=>b.score-a.score); const live=state.status==='live'; $('#app').innerHTML=`<div class="wrap"><div class="top"><div class="brand"><h1>FirstMove Scanner</h1><div class="muted">Early momentum monitor • observed data only</div></div><div class="row"><div class="pill status"><span class="dot ${live?'live':state.status==='error'?'err':''}"></span>${state.status} • ${state.symbols.length}/50</div><button class="btn" data-diagnostics>Diagnostics</button><button class="btn" data-how>How it works</button><button class="btn primary" data-settings>Settings</button></div></div>${!state.key?`<div class="banner"><b>Setup required.</b> Add your Finnhub API key in Settings. The scanner does not generate fake market data.</div>`:''}<div class="toolbar"><div class="field grow"><label>Add symbol</label><div class="row"><input class="grow" data-symbol placeholder="AAPL"/><button class="btn primary" data-add>Add</button></div></div></div><div class="section-title"><b>Top Radar</b><span class="muted">highest current activity scores</span></div><div class="card radar"><div class="grid">${rows.slice(0,8).map(m=>`<div class="radar-card"><div class="row"><h3>${m.sym}</h3><span class="stage ${m.stage}">${m.stage}</span></div><div class="score">${m.score}</div><div>${fmtPct(m.r1)} 1m • ${fmtPct(m.r3)} 3m</div><div class="small">${m.why}</div></div>`).join('')||'<div class="muted">Waiting for live trade events.</div>'}</div></div><div class="card table"><table><thead><tr><th>#</th><th>Symbol</th><th>Price</th><th>1m%</th><th>3m%</th><th>5m%</th><th>Vol accel</th><th>$ vol 5m</th><th>Score</th><th>Stage</th><th>Fresh</th><th>Reason</th><th></th></tr></thead><tbody>${state.symbols.map(sym=>metrics(sym)).sort((a,b)=>(b?.score||-1)-(a?.score||-1)).map((m,i)=>m?`<tr><td>${i+1}</td><td><b>${m.sym}</b> <span class="pin ${state.pinned.has(m.sym)?'on':''}" data-pin="${m.sym}">★</span></td><td>$${m.p.toFixed(2)}</td><td>${fmtPct(m.r1)}</td><td>${fmtPct(m.r3)}</td><td>${fmtPct(m.r5)}</td><td>${m.volAccel.toFixed(2)}x</td><td>${fmtMoney(m.dv)}</td><td><b>${m.score}</b></td><td><span class="stage ${m.stage}">${m.stage}</span></td><td>${Math.round((Date.now()-m.last)/1000)}s</td><td class="reason">${m.why}</td><td><button class="btn" data-remove="${m.sym}">×</button></td></tr>`:`<tr><td>${i+1}</td><td><b>${state.symbols[i]}</b></td><td colspan="10" class="muted">Waiting for trades...</td><td><button class="btn" data-remove="${state.symbols[i]}">×</button></td></tr>`).join('')}</tbody></table></div><div class="card log"><div class="section-title"><b>Observation Log</b><span class="muted">records first EARLY/BUILDING ≥70; browser-only</span></div>${state.logs.length?`<div class="table"><table><thead><tr><th>Symbol</th><th>Time</th><th>Observed</th><th>Score</th><th>Stage</th><th>MFE</th><th>MAE</th></tr></thead><tbody>${state.logs.slice(0,100).map(l=>`<tr><td>${l.sym}</td><td>${new Date(l.time).toLocaleString()}</td><td>$${l.price.toFixed(2)}</td><td>${l.score}</td><td>${l.stage}</td><td>${fmtPct(l.mfe)}</td><td>${fmtPct(l.mae)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">No qualifying observations yet.</div>'}</div><div class="small" style="margin:18px 0">This tool describes observed market activity. It does not predict prices or execute trades.</div></div>`; bind()}
function drawer(title,html){document.body.insertAdjacentHTML('beforeend',`<div class="drawer" id="drawer"><div class="row"><h2 class="grow">${title}</h2><button class="btn" data-close>Close</button></div>${html}</div>`);$('[data-close]').onclick=()=>$('#drawer').remove()}
function bind(){$('[data-add]').onclick=()=>addSymbol($('[data-symbol]').value);$('[data-symbol]').onkeydown=e=>{if(e.key==='Enter')addSymbol(e.target.value)};$$('[data-remove]').forEach(b=>b.onclick=()=>removeSymbol(b.dataset.remove));$$('[data-pin]').forEach(x=>x.onclick=()=>{state.pinned.has(x.dataset.pin)?state.pinned.delete(x.dataset.pin):state.pinned.add(x.dataset.pin);save();render()});$('[data-settings]').onclick=()=>drawer('Settings',`<div class="field"><label>Finnhub API key</label><input id="keyinput" type="password" value="${state.key}" placeholder="Paste key"/><div class="small">Saved only in this browser's localStorage.</div></div><div style="margin-top:12px"><button class="btn primary" id="savekey">Save & connect</button></div>`),setTimeout(()=>{const b=$('#savekey');if(b)b.onclick=()=>{state.key=$('#keyinput').value.trim();localStorage.setItem('fm_key',state.key);$('#drawer').remove();connect()}},0);$('[data-diagnostics]').onclick=()=>drawer('Diagnostics',`<p>Status: <b>${state.status}</b></p><p>Subscribed: <b>${state.symbols.length}/50</b></p><p>Last websocket message: ${state.lastMsg?new Date(state.lastMsg).toLocaleTimeString():'none'}</p><div class="error">${state.errors.slice(0,10).join('\n')||'No recorded errors.'}</div>`);$('[data-how]').onclick=()=>drawer('How it works',`<p>The scanner scores <b>observed</b> momentum from trade events in the current browser session.</p><p><b>Score components:</b> price acceleration, volume/trade acceleration, 5-minute dollar volume, non-extension, proximity to 15-minute high, and freshness.</p><p><b>EARLY:</b> score ≥62, positive 1-minute move and positive acceleration. <b>BUILDING:</b> score ≥78, positive 1-minute move and volume acceleration >1.25x. <b>EXTENDED:</b> >8% in 5 minutes or >5% in 3 minutes. <b>WEAKENING:</b> negative 1-minute move with falling acceleration.</p><p>It needs enough live trades to establish rolling windows.</p>`)}
render();if(state.key)connect();</script>
</body>
</html>
