const state={key:localStorage.getItem('fm_key')||'',manual:new Set(JSON.parse(localStorage.getItem('fm_manual')||'[]')),pinned:new Set(JSON.parse(localStorage.getItem('fm_pinned')||'[]')),symbols:[],trades:{},ws:null,stream:'idle',lastMsg:0,discoveryStatus:'idle',discoveryAt:0,discovery:[],prev:new Map(),feedStatus:{},error:'',logs:JSON.parse(localStorage.getItem('fm_v3_logs')||'[]'),discLogs:JSON.parse(localStorage.getItem('fm_v3_disc_logs')||'[]'),filters:{minPrice:+(localStorage.getItem('fm_minPrice')||1),maxPrice:+(localStorage.getItem('fm_maxPrice')||100),minVol:+(localStorage.getItem('fm_minVol')||200000),maxGain:+(localStorage.getItem('fm_maxGain')||15),excludeFunds:(localStorage.getItem('fm_excludeFunds')??'true')==='true'}};
function persist(){localStorage.setItem('fm_manual',JSON.stringify([...state.manual]));localStorage.setItem('fm_pinned',JSON.stringify([...state.pinned]));localStorage.setItem('fm_v3_logs',JSON.stringify(state.logs));localStorage.setItem('fm_v3_disc_logs',JSON.stringify(state.discLogs));for(const[k,v]of Object.entries(state.filters))localStorage.setItem('fm_'+k,v)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function pct(a,b){return b?((a/b)-1)*100:0}function before(a,t){for(let i=a.length-1;i>=0;i--)if(a[i].t<=t)return a[i].p;return a[0]?.p||0}
function etMinutes(ts=Date.now()){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(ts)).filter(p=>p.type!=='literal').map(p=>[p.type,+p.value]));return parts.hour*60+parts.minute}
function regularProgress(ts){return clamp((etMinutes(ts)-570)/390,.03,1)}
function corporateActionRisk(q){const acts=Array.isArray(q.corporateActions)?q.corporateActions:[],now=Date.now();for(const a of acts){const type=String(a?.meta?.eventType||'').toUpperCase(),t=+a?.meta?.dateEpochMs||0;if(type==='DELISTING'&&(!t||t<=now+864e5))return{type,message:a.message||a.header||'Delisting'};if(type==='SPLIT'&&(!t||Math.abs(now-t)<=2*864e5))return{type,message:a.message||a.header||'Recent split'};if(type==='TICKER_CHANGE'&&(!t||Math.abs(now-t)<=14*864e5))return{type,message:a.message||a.header||'Recent ticker change'}}return null}
function securityIsExcluded(q){const type=String(q.quoteType||'').toUpperCase(),name=String(q.longName||q.shortName||q.displayName||'').toLowerCase(),sym=String(q.symbol||'').toUpperCase();if(['ETF','MUTUALFUND','MONEYMARKET','INDEX','FUTURE','OPTION','CRYPTOCURRENCY'].includes(type))return true;if(/\b(warrant|warrants|preferred|preference|unit|units|right|rights|depositary share|depositary shares)\b/i.test(name))return true;if(/[-.](WS|WT|W|U|R|P[A-Z]?)$/.test(sym))return true;return false}
function validSpread(x){if(x.session!=='REGULAR'||!(x.bid>0&&x.ask>0&&x.ask>=x.bid&&x.price>0))return null;const mid=(x.ask+x.bid)/2,off=Math.abs(mid-x.price)/x.price,sp=((x.ask-x.bid)/mid)*100;if(off>.03||sp>8)return null;return sp}
function liveMetrics(sym){const a=state.trades[sym]||[];if(!a.length)return null;const now=Date.now(),last=a[a.length-1],p=last.p,p1=before(a,now-6e4),p3=before(a,now-18e4),p5=before(a,now-3e5),p6=before(a,now-36e4),r1=pct(p,p1),r3=pct(p,p3),r5=pct(p,p5),prev3=pct(p3,p6),accel=r3-prev3,c=a.filter(x=>x.t>now-6e4),pr=a.filter(x=>x.t<=now-6e4&&x.t>now-12e4),cv=c.reduce((s,x)=>s+x.v,0),pv=pr.reduce((s,x)=>s+x.v,0),volAccel=pv?cv/pv:cv?2:0,tradeAccel=pr.length?c.length/pr.length:c.length?2:0,dv=a.filter(x=>x.t>now-3e5).reduce((s,x)=>s+x.p*x.v,0),recent=a.filter(x=>x.t>now-9e5),hi=Math.max(...recent.map(x=>x.p)),near=hi?p/hi:0,pricePts=clamp(Math.max(0,r1)*5+Math.max(0,accel)*5,0,30),flowPts=clamp(Math.max(0,volAccel-1)*9+Math.max(0,tradeAccel-1)*6,0,25),liq=clamp(Math.log10(Math.max(1,dv))*2.2,0,15),nonExt=15-clamp(Math.abs(r5)*1.6,0,15),hiPts=clamp((near-.94)*125,0,10),fresh=Date.now()-last.t<1e4?5:Date.now()-last.t<6e4?3:1,score=Math.round(clamp(pricePts+flowPts+liq+nonExt+hiPts+fresh,0,100));let stage='WATCH';if(r5>8||r3>5)stage='EXTENDED';else if(accel<-.35&&r1<0)stage='WEAKENING';else if(score>=78&&r1>0&&volAccel>1.25)stage='BUILDING';else if(score>=62&&r1>0&&accel>0)stage='EARLY';const why=[];if(accel>.2)why.push(`price acceleration +${accel.toFixed(2)}%`);if(volAccel>1.2)why.push(`volume ${volAccel.toFixed(1)}x prior min`);if(tradeAccel>1.2)why.push(`trade pace ${tradeAccel.toFixed(1)}x`);if(near>.985)why.push('near 15m high');if(!why.length)why.push('not enough live acceleration yet');return{sym,p,r1,r3,r5,volAccel,dv,score,stage,last:last.t,why:why.join(' • ')}}
function addTrade(t){if(!t?.s||!Number.isFinite(+t.p)||!Number.isFinite(+t.t))return;const a=state.trades[t.s]||(state.trades[t.s]=[]);a.push({p:+t.p,t:+t.t,v:+t.v||0});while(a.length&&a[0].t<Date.now()-12e5)a.shift();const m=liveMetrics(t.s);if(m&&m.score>=70&&['EARLY','BUILDING'].includes(m.stage)){const id=`${new Date().toISOString().slice(0,10)}:${m.sym}`;if(!state.logs.find(x=>x.id===id))state.logs.unshift({id,sym:m.sym,time:Date.now(),price:m.p,score:m.score,stage:m.stage,mfe:0,mae:0})}for(const l of state.logs.filter(x=>x.sym===t.s)){const mv=pct(+t.p,l.price);l.mfe=Math.max(l.mfe,mv);l.mae=Math.min(l.mae,mv)}persist()}
function stageFromDiscovery(x){if(x.actionRisk)return'WATCH';if(x.pct>12)return'EXTENDED';if(x.snapAccel<-.5)return'WEAKENING';if(x.score>=78&&x.snapAccel>0&&x.dayPos>.72)return'BUILDING';if(x.score>=62&&x.snapAccel>=0&&x.pct<10)return'EARLY';return'WATCH'}
function scoreDiscovery(x,prev){const sameSession=prev&&prev.session===x.session,snapAccel=sameSession?x.pct-prev.pct:0,canFlow=sameSession&&x.session==='REGULAR',volDelta=canFlow?Math.max(0,x.volume-prev.volume):0,newFlow=volDelta*x.price,volAvg=x.avgVol>0?x.volume/x.avgVol:0,progress=x.session==='REGULAR'?regularProgress(x.quoteTime||Date.now()):1,volPace=x.session==='REGULAR'&&x.avgVol>0?x.volume/(x.avgVol*progress):0,spread=validSpread(x),dayPos=x.session==='REGULAR'&&x.dayHigh>x.dayLow?clamp((x.price-x.dayLow)/(x.dayHigh-x.dayLow),0,1):.5,ageSec=x.quoteTime?Math.max(0,(Date.now()-x.quoteTime)/1000):99999,accelPts=clamp(Math.max(0,snapAccel)*35,0,25),volPts=x.session==='REGULAR'?clamp(Math.max(0,volPace-.65)*15,0,20):0,strengthPts=clamp(Math.max(0,x.pct)*2.2,0,15),liqPts=clamp(Math.log10(Math.max(1,x.volume*x.price))*2.1,0,15),rangePts=x.session==='REGULAR'?clamp((dayPos-.45)*18,0,10):4,spreadPts=spread==null?0:clamp(10-spread*5,0,10),diversityPts=clamp((x.feeds?.length||1)*1.5,0,5),freshnessPenalty=ageSec>600?12:ageSec>180?6:0,extensionPenalty=x.pct>10?Math.min(15,(x.pct-10)*2):0,riskPenalty=x.actionRisk?30:0,score=Math.round(clamp(accelPts+volPts+strengthPts+liqPts+rangePts+spreadPts+diversityPts-extensionPenalty-freshnessPenalty-riskPenalty,0,100));return{...x,snapAccel,volDelta,newFlow,volAvg,volPace,spread,dayPos,ageSec,score,components:{accelPts,volPts,strengthPts,liqPts,rangePts,spreadPts,diversityPts,extensionPenalty,freshnessPenalty,riskPenalty}}}
function normalizeQuote(q,tag){const regularPrice=+q.regularMarketPrice||0,prevClose=+q.regularMarketPreviousClose||0,marketState=String(q.marketState||'REGULAR').toUpperCase();let session='REGULAR',price=regularPrice,pctv=Number.isFinite(+q.regularMarketChangePercent)?+q.regularMarketChangePercent:pct(regularPrice,prevClose),quoteTime=(+q.regularMarketTime||0)*1000;if(marketState.startsWith('PRE')&&+q.preMarketPrice>0){session='PRE';price=+q.preMarketPrice;pctv=Number.isFinite(+q.preMarketChangePercent)?+q.preMarketChangePercent:pct(price,prevClose);quoteTime=(+q.preMarketTime||+q.regularMarketTime||0)*1000}else if(marketState.startsWith('POST')&&+q.postMarketPrice>0){session='POST';price=+q.postMarketPrice;pctv=Number.isFinite(+q.postMarketChangePercent)?+q.postMarketChangePercent:pct(price,prevClose);quoteTime=(+q.postMarketTime||+q.regularMarketTime||0)*1000}const actionRisk=corporateActionRisk(q),hardExcluded=['DELISTING','TICKER_CHANGE'].includes(actionRisk?.type),volume=session==='REGULAR'?(+q.regularMarketVolume||0):0;return{symbol:q.symbol,name:q.longName||q.shortName||q.displayName||'',quoteType:q.quoteType||'',excluded:securityIsExcluded(q),hardExcluded,actionRisk,session,marketState,price,pct:pctv,regularPrice,prevClose,volume,avgVol:+q.averageDailyVolume3Month||0,marketCap:+q.marketCap||0,source:q.quoteSourceName||'Unknown',quoteTime,delay:+q.exchangeDataDelayedBy||0,bid:+q.bid||0,ask:+q.ask||0,exchange:q.fullExchangeName||q.exchange||'',dayHigh:+q.regularMarketDayHigh||0,dayLow:+q.regularMarketDayLow||0,feeds:[tag]}}
function updateDiscoveryProof(rows){const now=Date.now(),day=new Date().toISOString().slice(0,10);for(const x of rows){for(const l of state.discLogs.filter(l=>l.sym===x.symbol)){const mv=pct(x.price,l.price);l.mfe=Math.max(l.mfe,mv);l.mae=Math.min(l.mae,mv);l.last=now}if(!x.actionRisk&&x.score>=70&&['EARLY','BUILDING'].includes(x.stage)){const id=`${day}:${x.session}:${x.symbol}`;if(!state.discLogs.find(l=>l.id===id))state.discLogs.unshift({id,sym:x.symbol,time:now,last:now,price:x.price,score:x.score,stage:x.stage,session:x.session,mfe:0,mae:0})}}state.discLogs=state.discLogs.slice(0,250);persist()}
async function fetchFeed([key,url,label]){state.feedStatus[key]='loading';try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json(),quotes=j?.finance?.result?.[0]?.quotes||[];state.feedStatus[key]=`ok:${quotes.length}`;return quotes.map(q=>normalizeQuote(q,label))}catch(e){state.feedStatus[key]='error';return[]}}
function syncSymbols(){const auto=state.discovery.filter(x=>['EARLY','BUILDING','WATCH'].includes(x.stage)&&!x.actionRisk).slice(0,35).map(x=>x.symbol),next=[...new Set([...state.pinned,...state.manual,...auto])].slice(0,50),old=new Set(state.symbols);state.symbols=next;if(state.ws?.readyState===1){for(const s of next)if(!old.has(s))state.ws.send(JSON.stringify({type:'subscribe',symbol:s}));for(const s of old)if(!next.includes(s))state.ws.send(JSON.stringify({type:'unsubscribe',symbol:s}))}}
async function discover(){state.discoveryStatus='loading';state.error='';render();const batches=await Promise.all(FEEDS.map(fetchFeed)),merged=new Map();for(const rows of batches)for(const x of rows){const old=merged.get(x.symbol);if(!old)merged.set(x.symbol,x);else{old.feeds=[...new Set([...old.feeds,...x.feeds])];if(!old.actionRisk&&x.actionRisk)old.actionRisk=x.actionRisk;if(x.hardExcluded)old.hardExcluded=true}}const now=Date.now(),f=state.filters;let rows=[...merged.values()].filter(x=>x.symbol&&!x.hardExcluded&&(!f.excludeFunds||!x.excluded)&&x.price>=f.minPrice&&x.price<=f.maxPrice&&(x.session!=='REGULAR'||x.volume>=f.minVol)&&x.pct>-5&&x.pct<=f.maxGain);rows=rows.map(x=>scoreDiscovery(x,state.prev.get(x.symbol))).filter(x=>x.ageSec<=(x.session==='REGULAR'?300:900)).map(x=>({...x,stage:stageFromDiscovery(x)}));rows.sort((a,b)=>{const sa=a.stage==='EARLY'?3:a.stage==='BUILDING'?2:a.stage==='WATCH'?1:0,sb=b.stage==='EARLY'?3:b.stage==='BUILDING'?2:b.stage==='WATCH'?1:0;return sb-sa||b.score-a.score||b.snapAccel-a.snapAccel});state.discovery=rows;updateDiscoveryProof(rows);state.prev=new Map([...merged.values()].map(x=>[x.symbol,{pct:x.pct,volume:x.volume,session:x.session,t:now}]));state.discoveryAt=now;state.discoveryStatus=rows.length?'live':'error';if(!rows.length)state.error='Discovery returned no candidates after filters.';syncSymbols();render()}
function connect(){if(state.ws)try{state.ws.close()}catch{};if(!state.key){state.stream='idle';render();return}state.stream='connecting';render();const ws=new WebSocket(`wss://ws.finnhub.io?token=${encodeURIComponent(state.key)}`);state.ws=ws;ws.onopen=()=>{state.stream='live';state.symbols.forEach(symbol=>ws.send(JSON.stringify({type:'subscribe',symbol})));render()};ws.onmessage=e=>{state.lastMsg=Date.now();try{const m=JSON.parse(e.data);if(m.type==='trade')(m.data||[]).forEach(addTrade);if(m.type==='error')state.error=m.msg||'stream error'}catch(err){state.error=String(err)}render()};ws.onerror=()=>{state.stream='error';state.error='WebSocket error';render()};ws.onclose=()=>{if(state.stream!=='idle')state.stream='closed';render()}}
function addManual(s){s=(s||'').trim().toUpperCase();if(!s)return;state.manual.add(s);persist();syncSymbols();render()}function fmtPct(n){return `<span class="${n>0?'good':n<0?'bad':''}">${n>=0?'+':''}${n.toFixed(2)}%</span>`}function money(n){return n>=1e9?'$'+(n/1e9).toFixed(1)+'B':n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1e3?'$'+(n/1e3).toFixed(0)+'K':'$'+Math.round(n)}function xnum(n){return Number.isFinite(n)&&n>0?n.toFixed(2)+'x':'—'}

function componentLine(x){const c=x.components;return `<div class="comp"><span>Accel ${Math.round(c.accelPts)}</span><span>Vol ${Math.round(c.volPts)}</span><span>Strength ${Math.round(c.strengthPts)}</span><span>Liq ${Math.round(c.liqPts)}</span><span>Range ${Math.round(c.rangePts)}</span><span>Spread ${Math.round(c.spreadPts)}</span>${c.riskPenalty?`<span class="risk">Risk -${Math.round(c.riskPenalty)}</span>`:''}</div>`}
function whyDiscovery(x){const a=[];if(x.actionRisk)a.push(`DATA GUARD: ${x.actionRisk.type}`);if(x.snapAccel>.15)a.push(`snapshot accel ${x.snapAccel.toFixed(2)}%`);if(x.session==='REGULAR'&&x.volPace>.8)a.push(`volume pace ${x.volPace.toFixed(2)}x normal`);if(x.session==='REGULAR'&&x.dayPos>.8)a.push('upper day range');if((x.feeds||[]).length>1)a.push(`${x.feeds.length} discovery feeds`);if(x.spread!=null&&x.spread<.5)a.push(`spread ${x.spread.toFixed(2)}%`);if(x.session!=='REGULAR')a.push('premarket/postmarket volume not scored');if(!a.length)a.push('building activity but not yet confirmed');return a.join(' • ')}
function render(){const live=state.symbols.map(liveMetrics).filter(Boolean).sort((a,b)=>b.score-a.score);$('#app').innerHTML=`<div class="wrap"><div class="top"><div><h1>FirstMove Scanner v3</h1><div class="muted">Early momentum discovery • data-quality guarded • build ${BUILD}</div></div><div class="row"><span class="pill"><i class="dot ${state.discoveryStatus==='live'?'live':state.discoveryStatus==='error'?'err':''}"></i>Discovery ${state.discoveryStatus}</span><span class="pill"><i class="dot ${state.stream==='live'?'live':state.stream==='error'?'err':''}"></i>Live ${state.stream}</span><button class="btn" data-diag>Diagnostics</button><button class="btn primary" data-settings>Settings</button></div></div>${!state.key?`<div class="banner"><b>Discovery works without an API key.</b> Finnhub only adds trade-by-trade 1m/3m/5m acceleration for the highest-ranked candidates.</div>`:''}<div class="toolbar"><div class="field"><label>Min $</label><input data-f="minPrice" type="number" value="${state.filters.minPrice}" style="width:80px"></div><div class="field"><label>Max $</label><input data-f="maxPrice" type="number" value="${state.filters.maxPrice}" style="width:80px"></div><div class="field"><label>Min volume</label><input data-f="minVol" type="number" value="${state.filters.minVol}" style="width:115px"></div><div class="field"><label>Max day gain %</label><input data-f="maxGain" type="number" value="${state.filters.maxGain}" style="width:100px"></div><div class="field"><label>Common stocks only</label><label class="pill"><input data-fcheck="excludeFunds" type="checkbox" ${state.filters.excludeFunds?'checked':''} style="width:auto"> Exclude ETFs/warrants/units</label></div><div class="field grow"><label>Manual symbol</label><div class="row"><input class="grow" data-symbol placeholder="AAPL"/><button class="btn" data-add>Add</button></div></div><button class="btn primary" data-refresh>Refresh now</button></div><div class="section"><b>Early Discovery Radar</b><span class="small">${state.discovery.length} candidates • refresh 30s</span></div><div class="card table"><table><thead><tr><th>#</th><th>Symbol</th><th>Stage</th><th>Session</th><th>Price</th><th>Day %</th><th>30s accel</th><th>Vol Pace</th><th>Day range</th><th>Volume</th><th>New $ flow</th><th>Spread</th><th>Age</th><th>Score</th><th>Why now / score components</th></tr></thead><tbody>${state.discovery.slice(0,40).map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.symbol}</b><div class="small">${x.name}</div><div>${(x.feeds||[]).map(t=>`<span class="tag">${t}</span>`).join(' ')}</div></td><td><span class="stage ${x.stage}">${x.stage}</span></td><td><span class="tag">${x.session}</span></td><td>$${x.price.toFixed(2)}</td><td>${fmtPct(x.pct)}</td><td>${fmtPct(x.snapAccel)}</td><td>${xnum(x.volPace)}</td><td>${x.session==='REGULAR'?(x.dayPos*100).toFixed(0)+'%':'—'}</td><td>${x.session==='REGULAR'?x.volume.toLocaleString():'—'}</td><td>${money(x.newFlow)}</td><td>${x.spread==null?'—':x.spread.toFixed(2)+'%'}</td><td class="${x.ageSec>180?'warn':''}">${x.ageSec<90?Math.round(x.ageSec)+'s':Math.round(x.ageSec/60)+'m'}</td><td><b>${x.score}</b></td><td class="reason">${whyDiscovery(x)}${componentLine(x)}</td></tr>`).join('')||`<tr><td colspan="15" class="muted">Waiting for discovery feeds.</td></tr>`}</tbody></table></div>${state.error?`<div class="banner">${state.error}</div>`:''}<div class="section"><b>Discovery Proof Log</b><span class="small">first EARLY/BUILDING ≥70 • clean v3 observations only</span></div><div class="card table"><table><thead><tr><th>Symbol</th><th>Session</th><th>Time</th><th>Observed</th><th>Score</th><th>Stage</th><th>MFE</th><th>MAE</th></tr></thead><tbody>${state.discLogs.slice(0,50).map(l=>`<tr><td>${l.sym}</td><td>${l.session}</td><td>${new Date(l.time).toLocaleString()}</td><td>$${l.price.toFixed(2)}</td><td>${l.score}</td><td>${l.stage}</td><td>${fmtPct(l.mfe)}</td><td>${fmtPct(l.mae)}</td></tr>`).join('')||`<tr><td colspan="8" class="muted">No qualifying discovery observations yet.</td></tr>`}</tbody></table></div><div class="section"><b>Top Live Radar</b><span class="small">highest-ranked candidates auto-subscribed • max 50</span></div><div class="card"><div class="grid">${live.slice(0,8).map(m=>`<div class="radar"><div class="row"><h3>${m.sym}</h3><span class="stage ${m.stage}">${m.stage}</span></div><div class="score">${m.score}</div><div>${fmtPct(m.r1)} 1m • ${fmtPct(m.r3)} 3m • ${fmtPct(m.r5)} 5m</div><div class="small">${m.why}</div></div>`).join('')||'<div class="muted">Add a Finnhub key in Settings to activate the live trade layer.</div>'}</div></div><div class="section"><b>Observation Log</b><span class="small">first qualifying live EARLY/BUILDING ≥70</span></div><div class="card table"><table><thead><tr><th>Symbol</th><th>Time</th><th>Observed</th><th>Score</th><th>Stage</th><th>MFE</th><th>MAE</th></tr></thead><tbody>${state.logs.slice(0,50).map(l=>`<tr><td>${l.sym}</td><td>${new Date(l.time).toLocaleString()}</td><td>$${l.price.toFixed(2)}</td><td>${l.score}</td><td>${l.stage}</td><td>${fmtPct(l.mfe)}</td><td>${fmtPct(l.mae)}</td></tr>`).join('')||`<tr><td colspan="7" class="muted">No qualifying observations yet.</td></tr>`}</tbody></table></div><div class="small warn">Safeguards: five discovery feeds, 30-second snapshot acceleration, time-adjusted regular-session volume pace, stale spread rejection, hard quote freshness, recent split penalty, delisting/ticker-change exclusion, and no premarket volume claims when the free feed does not provide reliable premarket volume.</div></div>`;bind()}
function bind(){const feedText=Object.entries(state.feedStatus).map(([k,v])=>`${k}:${v}`).join(' • ');$('[data-refresh]').onclick=discover;$('[data-add]').onclick=()=>addManual($('[data-symbol]').value);$('[data-symbol]').onkeydown=e=>{if(e.key==='Enter')addManual(e.target.value)};$$('[data-f]').forEach(el=>el.onchange=()=>{state.filters[el.dataset.f]=+el.value;persist();discover()});$$('[data-fcheck]').forEach(el=>el.onchange=()=>{state.filters[el.dataset.fcheck]=el.checked;persist();discover()});$('[data-settings]').onclick=()=>{drawer('Settings',`<div class="field"><label>Finnhub API key</label><input id="key" type="password" value="${state.key}"/><div class="small">Stored only in this browser via localStorage.</div></div><div style="margin-top:12px"><button class="btn primary" id="save">Save & connect</button></div>`);$('#save').onclick=()=>{state.key=$('#key').value.trim();localStorage.setItem('fm_key',state.key);$('#drawer').remove();connect()}};$('[data-diag]').onclick=()=>drawer('Diagnostics',`<p>Build: <b>${BUILD}</b></p><p>Discovery: <b>${state.discoveryStatus}</b></p><p>Candidates: <b>${state.discovery.length}</b></p><p>Last discovery: ${state.discoveryAt?new Date(state.discoveryAt).toLocaleTimeString():'none'}</p><p>Feeds: <span class="small">${feedText||'none yet'}</span></p><p>Live stream: <b>${state.stream}</b></p><p>Subscriptions: <b>${state.symbols.length}/50</b></p><p>Last stream message: ${state.lastMsg?new Date(state.lastMsg).toLocaleTimeString():'none'}</p><p class="small">Scores are deterministic. Stale spread data, recent splits, and delistings are guarded rather than silently scored as clean data.</p>${state.error?`<div class="banner">${state.error}</div>`:''}`)}
state.symbols=[...state.manual];render();discover();if(state.key)connect();setInterval(discover,30000);
</script></body></html>
