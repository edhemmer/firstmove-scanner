<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FirstMove Scanner</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#070b11;color:#e8eef5}*{box-sizing:border-box}body{margin:0;background:#070b11;color:#e8eef5}.wrap{max-width:1500px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;border-bottom:1px solid #202a36;padding:10px 0 16px}.top h1{font-size:22px;margin:0}.muted,.small{color:#91a0b1}.muted{font-size:13px}.small{font-size:11px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card,.toolbar{background:#0d141d;border:1px solid #202c39;border-radius:12px}.card{padding:14px;margin:14px 0}.toolbar{padding:12px;margin:14px 0;display:flex;gap:10px;align-items:end;flex-wrap:wrap}.btn,.pill,input{border:1px solid #2c3949;background:#0d1621;color:#e8eef5;border-radius:8px;padding:9px 11px}.btn{cursor:pointer}.primary{background:#20d8cf;border-color:#20d8cf;color:#021313;font-weight:750}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:#91a0b1}.grow{flex:1}.pill{font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#768494;margin-right:6px}.dot.live{background:#2ee59d}.dot.err{background:#ff6d6d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:10px}.radar{border:1px solid #273444;border-radius:10px;padding:12px;background:#0a1119}.radar h3{margin:0}.score{font-size:26px;font-weight:800}.stage{font-size:11px;padding:3px 7px;border:1px solid #405165;border-radius:6px}.EARLY,.BUILDING{border-color:#229f75}.EXTENDED{border-color:#bb862d}.WEAKENING{border-color:#ba4a4a}.table{overflow:auto}.table table{border-collapse:collapse;width:100%;min-width:1050px}.table th,.table td{padding:10px 9px;border-bottom:1px solid #1d2834;text-align:right;font-size:12px;white-space:nowrap}.table th:nth-child(2),.table td:nth-child(2),.table th:last-child,.table td:last-child{text-align:left}.good{color:#43e39f}.bad{color:#ff7b7b}.reason{white-space:normal!important;min-width:220px;color:#a8b4c4}.banner{padding:12px;border:1px solid #624c18;background:#19170c;border-radius:10px;color:#f4d375;margin:12px 0}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(520px,94vw);background:#0b121b;border-left:1px solid #263140;padding:20px;z-index:10;overflow:auto;box-shadow:-20px 0 60px #0008}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 7px}.section b{font-size:14px}.pin{cursor:pointer;color:#8191a4}.pin.on{color:#f4be58}@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.wrap{padding:12px}.field{min-width:45%}}
</style>
</head>
<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={key:localStorage.getItem('fm_key')||'',manual:new Set(JSON.parse(localStorage.getItem('fm_manual')||'["AAPL","NVDA","TSLA","AMD","PLTR"]')),pinned:new Set(JSON.parse(localStorage.getItem('fm_pinned')||'[]')),symbols:[],trades:{},ws:null,stream:'idle',lastMsg:0,discoveryStatus:'idle',discoveryAt:0,discovery:[],prev:new Map(),error:'',logs:JSON.parse(localStorage.getItem('fm_logs')||'[]')};
function persist(){localStorage.setItem('fm_manual',JSON.stringify([...state.manual]));localStorage.setItem('fm_pinned',JSON.stringify([...state.pinned]));localStorage.setItem('fm_logs',JSON.stringify(state.logs));}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))} function pct(a,b){return b?((a/b)-1)*100:0}
function before(a,t){for(let i=a.length-1;i>=0;i--)if(a[i].t<=t)return a[i].p;return a[0]?.p||0}
function liveMetrics(sym){const a=state.trades[sym]||[];if(!a.length)return null;const now=Date.now(),last=a[a.length-1],p=last.p,p1=before(a,now-6e4),p3=before(a,now-18e4),p5=before(a,now-3e5),p6=before(a,now-36e4),r1=pct(p,p1),r3=pct(p,p3),r5=pct(p,p5),prev3=pct(p3,p6),accel=r3-prev3;const c=a.filter(x=>x.t>now-6e4),pr=a.filter(x=>x.t<=now-6e4&&x.t>now-12e4),cv=c.reduce((s,x)=>s+x.v,0),pv=pr.reduce((s,x)=>s+x.v,0),volAccel=pv?cv/pv:cv?2:0,tradeAccel=pr.length?c.length/pr.length:c.length?2:0,dv=a.filter(x=>x.t>now-3e5).reduce((s,x)=>s+x.p*x.v,0),recent=a.filter(x=>x.t>now-9e5),hi=Math.max(...recent.map(x=>x.p)),near=hi?p/hi:0;const pricePts=clamp(Math.max(0,r1)*5+Math.max(0,accel)*5,0,30),flowPts=clamp(Math.max(0,volAccel-1)*9+Math.max(0,tradeAccel-1)*6,0,25),liq=clamp(Math.log10(Math.max(1,dv))*2.2,0,15),nonExt=15-clamp(Math.abs(r5)*1.6,0,15),hiPts=clamp((near-.94)*125,0,10),fresh=Date.now()-last.t<1e4?5:Date.now()-last.t<6e4?3:1,score=Math.round(clamp(pricePts+flowPts+liq+nonExt+hiPts+fresh,0,100));let stage='WATCH';if(r5>8||r3>5)stage='EXTENDED';else if(accel<-.35&&r1<0)stage='WEAKENING';else if(score>=78&&r1>0&&volAccel>1.25)stage='BUILDING';else if(score>=62&&r1>0&&accel>0)stage='EARLY';const why=[];if(accel>.2)why.push(`price acceleration +${accel.toFixed(2)}%`);if(volAccel>1.2)why.push(`volume ${volAccel.toFixed(1)}x prior min`);if(tradeAccel>1.2)why.push(`trade pace ${tradeAccel.toFixed(1)}x`);if(near>.985)why.push('near 15m high');if(!why.length)why.push('not enough acceleration yet');return{sym,p,r1,r3,r5,volAccel,dv,score,stage,last:last.t,why:why.join(' • ')}}
function addTrade(t){if(!t?.s||!Number.isFinite(+t.p)||!Number.isFinite(+t.t))return;const a=state.trades[t.s]||(state.trades[t.s]=[]);a.push({p:+t.p,t:+t.t,v:+t.v||0});while(a.length&&a[0].t<Date.now()-12e5)a.shift();const m=liveMetrics(t.s);if(m&&m.score>=70&&['EARLY','BUILDING'].includes(m.stage)){const id=`${new Date().toISOString().slice(0,10)}:${m.sym}`;if(!state.logs.find(x=>x.id===id))state.logs.unshift({id,sym:m.sym,time:Date.now(),price:m.p,score:m.score,stage:m.stage,mfe:0,mae:0})}for(const l of state.logs.filter(x=>x.sym===t.s)){const mv=pct(+t.p,l.price);l.mfe=Math.max(l.mfe,mv);l.mae=Math.min(l.mae,mv)}persist()}
function syncSymbols(){const auto=state.discovery.slice(0,30).map(x=>x.symbol),next=[...new Set([...state.pinned,...state.manual,...auto])].slice(0,50),old=new Set(state.symbols);state.symbols=next;if(state.ws?.readyState===1){for(const s of next)if(!old.has(s))state.ws.send(JSON.stringify({type:'subscribe',symbol:s}));for(const s of old)if(!next.includes(s))state.ws.send(JSON.stringify({type:'unsubscribe',symbol:s}))}}
async function discover(){state.discoveryStatus='loading';render();try{const r=await fetch('/discovery',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json(),raw=j?.finance?.result?.[0]?.quotes||[],now=Date.now();const rows=raw.map(x=>({symbol:x.symbol,name:x.longName||x.shortName||x.displayName||'',price:+x.regularMarketPrice||0,pct:+x.regularMarketChangePercent||0,volume:+x.regularMarketVolume||0,marketCap:+x.marketCap||0,source:x.quoteSourceName||'Unknown',quoteTime:(+x.regularMarketTime||0)*1000,delay:+x.exchangeDataDelayedBy||0,bid:+x.bid||0,ask:+x.ask||0,exchange:x.fullExchangeName||x.exchange||''})).filter(x=>x.symbol&&x.price>=1&&x.price<=100&&x.volume>=200000&&x.pct>-3&&x.pct<=15);state.discovery=rows.map(x=>{const p=state.prev.get(x.symbol),pctAccel=p?x.pct-p.pct:0,volDelta=p?Math.max(0,x.volume-p.volume):0,newFlow=volDelta*x.price,spread=x.bid>0&&x.ask>0?((x.ask-x.bid)/((x.ask+x.bid)/2))*100:null,base=Math.max(0,x.pct)*2.2,acc=Math.max(0,pctAccel)*38,liq=Math.min(25,Math.log10(Math.max(1,x.volume*x.price))*3),flow=Math.min(25,Math.log10(Math.max(1,newFlow))*3),spreadPenalty=spread==null?0:Math.min(15,spread*3),score=Math.round(clamp(base+acc+liq+flow-spreadPenalty,0,100));return{...x,pctAccel,volDelta,newFlow,spread,score}}).sort((a,b)=>b.score-a.score);state.prev=new Map(rows.map(x=>[x.symbol,{pct:x.pct,volume:x.volume,t:now}]));state.discoveryAt=now;state.discoveryStatus='live';state.error='';syncSymbols()}catch(e){state.discoveryStatus='error';state.error=String(e?.message||e)}render()}
function connect(){if(state.ws)try{state.ws.close()}catch{};if(!state.key){state.stream='idle';render();return}state.stream='connecting';render();const ws=new WebSocket(`wss://ws.finnhub.io?token=${encodeURIComponent(state.key)}`);state.ws=ws;ws.onopen=()=>{state.stream='live';state.symbols.forEach(symbol=>ws.send(JSON.stringify({type:'subscribe',symbol})));render()};ws.onmessage=e=>{state.lastMsg=Date.now();try{const m=JSON.parse(e.data);if(m.type==='trade')(m.data||[]).forEach(addTrade);if(m.type==='error')state.error=m.msg||'stream error'}catch(err){state.error=String(err)}render()};ws.onerror=()=>{state.stream='error';state.error='WebSocket error';render()};ws.onclose=()=>{if(state.stream!=='idle')state.stream='closed';render()}}
function addManual(s){s=(s||'').trim().toUpperCase();if(!s)return;state.manual.add(s);persist();syncSymbols();render()}
function removeManual(s){state.manual.delete(s);state.pinned.delete(s);delete state.trades[s];persist();syncSymbols();render()}
function fmtPct(n){return `<span class="${n>0?'good':n<0?'bad':''}">${n>=0?'+':''}${n.toFixed(2)}%</span>`}function money(n){return n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1e3?'$'+(n/1e3).toFixed(0)+'K':'$'+Math.round(n)}
function drawer(title,html){document.body.insertAdjacentHTML('beforeend',`<div class="drawer" id="drawer"><div class="row"><h2 class="grow">${title}</h2><button class="btn" data-close>Close</button></div>${html}</div>`);$('[data-close]').onclick=()=>$('#drawer').remove()}
function render(){const live=state.symbols.map(liveMetrics).filter(Boolean).sort((a,b)=>b.score-a.score);$('#app').innerHTML=`<div class="wrap"><div class="top"><div><h1>FirstMove Scanner</h1><div class="muted">Early momentum detection • active U.S. universe + live candidate tracking</div></div><div class="row"><span class="pill"><i class="dot ${state.discoveryStatus==='live'?'live':state.discoveryStatus==='error'?'err':''}"></i>Discovery ${state.discoveryStatus}</span><span class="pill"><i class="dot ${state.stream==='live'?'live':state.stream==='error'?'err':''}"></i>Live ${state.stream}</span><button class="btn" data-diag>Diagnostics</button><button class="btn primary" data-settings>Settings</button></div></div>${!state.key?`<div class="banner"><b>Discovery works without a key.</b> Add your Finnhub key in Settings only when you want live 1m/3m/5m trade acceleration on the discovered candidates.</div>`:''}<div class="toolbar"><div class="field grow"><label>Manual symbol</label><div class="row"><input class="grow" data-symbol placeholder="AAPL"/><button class="btn" data-add>Add</button></div></div><button class="btn primary" data-refresh>Refresh discovery</button></div><div class="section"><b>Active Universe Discovery</b><span class="small">verified Yahoo Finance most-active feed • $1–$100 • &gt;200k volume • day gain capped at 15%</span></div><div class="card table"><table><thead><tr><th>#</th><th>Symbol</th><th>Price</th><th>Day %</th><th>Snapshot accel</th><th>Volume</th><th>New $ flow</th><th>Spread</th><th>Score</th><th>Feed</th></tr></thead><tbody>${state.discovery.slice(0,20).map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.symbol}</b></td><td>$${x.price.toFixed(2)}</td><td>${fmtPct(x.pct)}</td><td>${fmtPct(x.pctAccel)}</td><td>${x.volume.toLocaleString()}</td><td>${money(x.newFlow)}</td><td>${x.spread==null?'—':x.spread.toFixed(2)+'%'}</td><td><b>${x.score}</b></td><td class="reason">${x.source}${x.delay?' • '+x.delay+'m delayed':''}</td></tr>`).join('')||`<tr><td colspan="10" class="muted">No discovery rows yet.</td></tr>`}</tbody></table></div>${state.error?`<div class="banner">${state.error}</div>`:''}<div class="section"><b>Top Live Radar</b><span class="small">up to 50 auto/manual symbols • requires Finnhub key</span></div><div class="card"><div class="grid">${live.slice(0,8).map(m=>`<div class="radar"><div class="row"><h3>${m.sym}</h3><span class="stage ${m.stage}">${m.stage}</span></div><div class="score">${m.score}</div><div>${fmtPct(m.r1)} 1m • ${fmtPct(m.r3)} 3m • ${fmtPct(m.r5)} 5m</div><div class="small">${m.why}</div></div>`).join('')||'<div class="muted">Waiting for live trade events.</div>'}</div></div><div class="card table"><table><thead><tr><th>#</th><th>Symbol</th><th>Price</th><th>1m</th><th>3m</th><th>5m</th><th>Vol accel</th><th>$ vol 5m</th><th>Score</th><th>Stage</th><th>Fresh</th><th>Why now</th><th></th></tr></thead><tbody>${state.symbols.map(sym=>({sym,m:liveMetrics(sym)})).sort((a,b)=>(b.m?.score||-1)-(a.m?.score||-1)).map((x,i)=>x.m?`<tr><td>${i+1}</td><td><b>${x.sym}</b> <span class="pin ${state.pinned.has(x.sym)?'on':''}" data-pin="${x.sym}">★</span></td><td>$${x.m.p.toFixed(2)}</td><td>${fmtPct(x.m.r1)}</td><td>${fmtPct(x.m.r3)}</td><td>${fmtPct(x.m.r5)}</td><td>${x.m.volAccel.toFixed(2)}x</td><td>${money(x.m.dv)}</td><td><b>${x.m.score}</b></td><td><span class="stage ${x.m.stage}">${x.m.stage}</span></td><td>${Math.round((Date.now()-x.m.last)/1000)}s</td><td class="reason">${x.m.why}</td><td>${state.manual.has(x.sym)?`<button class="btn" data-remove="${x.sym}">×</button>`:''}</td></tr>`:`<tr><td>${i+1}</td><td><b>${x.sym}</b></td><td colspan="10" class="muted">Waiting for live trades...</td><td>${state.manual.has(x.sym)?`<button class="btn" data-remove="${x.sym}">×</button>`:''}</td></tr>`).join('')}</tbody></table></div><div class="section"><b>Observation Log</b><span class="small">first EARLY/BUILDING ≥70; local browser record</span></div><div class="card table"><table><thead><tr><th>Symbol</th><th>Time</th><th>Observed</th><th>Score</th><th>Stage</th><th>MFE</th><th>MAE</th></tr></thead><tbody>${state.logs.slice(0,50).map(l=>`<tr><td>${l.sym}</td><td>${new Date(l.time).toLocaleString()}</td><td>$${l.price.toFixed(2)}</td><td>${l.score}</td><td>${l.stage}</td><td>${fmtPct(l.mfe)}</td><td>${fmtPct(l.mae)}</td></tr>`).join('')||`<tr><td colspan="7" class="muted">No qualifying observations yet.</td></tr>`}</tbody></table></div><div class="small" style="margin:16px 0">Current discovery source is an active-universe feed, not the full U.S. listed market. The scanner ranks observed activity; it does not predict prices or place trades.</div></div>`;bind()}
function bind(){$('[data-refresh]').onclick=discover;$('[data-add]').onclick=()=>addManual($('[data-symbol]').value);$('[data-symbol]').onkeydown=e=>{if(e.key==='Enter')addManual(e.target.value)};$$('[data-remove]').forEach(b=>b.onclick=()=>removeManual(b.dataset.remove));$$('[data-pin]').forEach(b=>b.onclick=()=>{state.pinned.has(b.dataset.pin)?state.pinned.delete(b.dataset.pin):state.pinned.add(b.dataset.pin);persist();syncSymbols();render()});$('[data-settings]').onclick=()=>{drawer('Settings',`<div class="field"><label>Finnhub API key</label><input id="key" type="password" value="${state.key}"/><div class="small">Stored only in this browser.</div></div><div style="margin-top:12px"><button class="btn primary" id="save">Save & connect</button></div>`);$('#save').onclick=()=>{state.key=$('#key').value.trim();localStorage.setItem('fm_key',state.key);$('#drawer').remove();connect()}};$('[data-diag]').onclick=()=>drawer('Diagnostics',`<p>Discovery: <b>${state.discoveryStatus}</b></p><p>Discovery rows: <b>${state.discovery.length}</b></p><p>Last discovery: ${state.discoveryAt?new Date(state.discoveryAt).toLocaleTimeString():'none'}</p><p>Live stream: <b>${state.stream}</b></p><p>Subscriptions: <b>${state.symbols.length}/50</b></p><p>Last stream message: ${state.lastMsg?new Date(state.lastMsg).toLocaleTimeString():'none'}</p><p class="small">Feed labels are taken from each quote response; delayed rows are shown as delayed.</p>${state.error?`<div class="banner">${state.error}</div>`:''}`)}
state.symbols=[...state.manual];render();discover();if(state.key)connect();setInterval(discover,30000);
</script></body></html>
